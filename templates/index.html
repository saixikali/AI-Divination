<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="易经算命 · 灵签 · 塔罗 · 姓名 · 每日运势 — 基于DeepSeek AI的拟人化解读">
    <title>易经算命 | 多种占卜 · AI 先生解读</title>
    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-mid: #16213e;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.12);
            --gold-glow: rgba(255, 215, 0, 0.35);
            --text-primary: #e8e8e8;
            --text-secondary: #b0b0b0;
            --text-muted: #888;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --wuxing-metal: #ffd700;
            --wuxing-wood: #4caf50;
            --wuxing-water: #42a5f5;
            --wuxing-fire: #ef5350;
            --wuxing-earth: #ff9800;
            --judge-daji: #66bb6a;
            --judge-xiong: #ef5350;
            --judge-ping: #ffa726;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
            background: linear-gradient(170deg, #0d0d1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(255, 215, 0, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(100, 150, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        /* ============ HEADER ============ */
        .site-header { text-align: center; margin-bottom: 10px; padding-top: 10px; }
        .site-header .brand-icon { font-size: 2.4rem; color: var(--gold); text-shadow: 0 0 40px rgba(255,215,0,0.4); letter-spacing: 6px; margin-bottom: 6px; }
        .site-header h1 { font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 35px rgba(255,215,0,0.4), 0 0 70px rgba(255,215,0,0.1); letter-spacing: 8px; margin-bottom: 0; font-weight: 700; }
        .site-header .ornament { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 12px 0 6px; color: rgba(255,215,0,0.3); font-size: 0.6rem; letter-spacing: 4px; }
        .site-header .ornament::before, .site-header .ornament::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent); }
        .site-header .subtitle { color: var(--text-muted); font-size: 0.88rem; letter-spacing: 4px; }

        /* ============ FEATURES ============ */
        .features-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .feature-item { text-align: center; padding: 14px 8px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border); }
        .feature-item .feature-icon { font-size: 1.6rem; margin-bottom: 6px; display: block; }
        .feature-item .feature-label { font-size: 0.78rem; color: var(--text-secondary); letter-spacing: 2px; line-height: 1.4; }

        /* ============ TYPE SELECTOR ============ */
        .type-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .type-chip {
            flex: 1 1 calc(33.333% - 8px);
            min-width: 92px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 6px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }
        .type-chip:hover { border-color: rgba(255,215,0,0.3); background: rgba(255,215,0,0.04); }
        .type-chip.active {
            border-color: var(--gold);
            background: rgba(255,215,0,0.1);
            box-shadow: 0 0 18px rgba(255,215,0,0.18);
        }
        .type-chip .chip-icon { font-size: 1.5rem; line-height: 1; }
        .type-chip .chip-label { font-size: 0.84rem; color: var(--text-primary); letter-spacing: 2px; }
        .type-chip.active .chip-label { color: var(--gold); }
        .type-desc {
            text-align: center; color: var(--text-muted); font-size: 0.8rem;
            letter-spacing: 1px; margin: 2px 0 16px; min-height: 1.2em;
        }

        /* ============ FORM CARD ============ */
        .form-card { background: var(--card-bg); border-radius: 16px; padding: 28px 24px; backdrop-filter: blur(12px); border: 1px solid var(--card-border); margin-bottom: 16px; }
        .form-card .form-header { text-align: center; margin-bottom: 24px; }
        .form-card .form-header .step-badge { display: inline-block; font-size: 0.72rem; color: var(--gold); letter-spacing: 3px; padding: 4px 14px; border: 1px solid rgba(255,215,0,0.2); border-radius: 20px; background: rgba(255,215,0,0.06); margin-bottom: 10px; }
        .form-card .form-header h3 { font-size: 1.15rem; color: var(--text-primary); letter-spacing: 3px; font-weight: 600; }

        .form-group { margin-bottom: 20px; }
        .form-group .field-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .form-group .field-num { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,215,0,0.12); color: var(--gold); font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
        .form-group label { color: #c8c8c8; font-size: 0.92rem; letter-spacing: 2px; }
        .form-group .field-hint { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; margin-left: 36px; letter-spacing: 1px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
            background: rgba(255,255,255,0.04); color: #fff; font-size: 0.98rem; font-family: inherit;
            transition: all 0.3s ease; letter-spacing: 1px;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.15), inset 0 0 0 1px rgba(255,215,0,0.1); background: rgba(255,255,255,0.06); }
        .form-group textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: #555; }

        /* ============ BUTTONS ============ */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.35s ease; letter-spacing: 4px; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, #e6c200 0%, #ffd700 30%, #ffaa00 100%); color: #1a1a2e; position: relative; overflow: hidden; }
        .btn-primary::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.6s ease; }
        .btn-primary:hover::after { left: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(255,215,0,0.35); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-primary); border: 1px solid var(--card-border); letter-spacing: 3px; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,215,0,0.3); }

        /* ============ LOADING ============ */
        .loading { display: none; text-align: center; padding: 60px 40px; }
        .loading.show { display: block; }
        .loading-bagua { width: 72px; height: 72px; margin: 0 auto 28px; position: relative; }
        .loading-bagua .ring { position: absolute; inset: 0; border: 3px solid transparent; border-radius: 50%; animation: baguaSpin 3s linear infinite; }
        .loading-bagua .ring:nth-child(1) { border-top-color: var(--gold); border-right-color: var(--gold); }
        .loading-bagua .ring:nth-child(2) { inset: 10px; border-bottom-color: rgba(255,215,0,0.5); border-left-color: rgba(255,215,0,0.5); animation-direction: reverse; animation-duration: 2s; }
        .loading-bagua .center-dot { position: absolute; inset: 50%; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 18px var(--gold-glow); }
        @keyframes baguaSpin { to { transform: rotate(360deg); } }
        .loading .loading-text { color: var(--text-secondary); letter-spacing: 3px; font-size: 0.95rem; animation: fadeText 2s ease-in-out infinite; }
        .loading .loading-sub { color: var(--text-muted); font-size: 0.78rem; letter-spacing: 1px; margin-top: 6px; }
        @keyframes fadeText { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* ============ ERROR ============ */
        .error { color: #ef5350; text-align: center; padding: 16px; background: rgba(244,67,54,0.08); border: 1px solid rgba(244,67,54,0.2); border-radius: 10px; display: none; margin-bottom: 12px; letter-spacing: 1px; }
        .error.show { display: block; }

        /* ============ RESULT ============ */
        .result { display: none; }
        .result.show { display: block; }
        .result-card { background: var(--card-bg); border-radius: 16px; padding: 24px; margin-bottom: 14px; backdrop-filter: blur(12px); border: 1px solid var(--card-border); opacity: 0; transform: translateY(30px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .result-card.visible { opacity: 1; transform: translateY(0); }

        .header-card { text-align: center; padding: 32px 24px; border: 1px solid rgba(255,215,0,0.18); background: rgba(255,215,0,0.04); }
        .header-card .pinyin { font-size: 0.9rem; color: var(--text-muted); letter-spacing: 3px; margin-bottom: 8px; font-style: italic; }
        .header-card .hex-name { font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.45); letter-spacing: 6px; }
        .header-card .hex-num { font-size: 0.88rem; color: var(--text-muted); letter-spacing: 2px; margin: 6px 0 14px; }
        .judgement-badge { display: inline-block; padding: 6px 28px; border-radius: 20px; font-size: 1rem; font-weight: 700; letter-spacing: 4px; animation: glowPulse 2s ease-in-out infinite; }
        .judgement-badge.daji { background: rgba(76,175,80,0.18); color: var(--judge-daji); border: 1px solid rgba(76,175,80,0.4); box-shadow: 0 0 18px rgba(76,175,80,0.2); }
        .judgement-badge.xiong { background: rgba(244,67,54,0.18); color: var(--judge-xiong); border: 1px solid rgba(244,67,54,0.4); box-shadow: 0 0 18px rgba(244,67,54,0.2); }
        .judgement-badge.ping { background: rgba(255,152,0,0.18); color: var(--judge-ping); border: 1px solid rgba(255,152,0,0.4); box-shadow: 0 0 18px rgba(255,152,0,0.2); }
        @keyframes glowPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

        .trigram-detail { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
        .trigram-block { padding: 16px; background: rgba(255,255,255,0.025); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .trigram-block .tri-symbol { font-size: 2.8rem; color: var(--gold); text-shadow: 0 0 16px rgba(255,215,0,0.3); line-height: 1.2; }
        .trigram-block .tri-name { font-size: 1.4rem; color: var(--text-primary); letter-spacing: 3px; margin: 4px 0; }
        .trigram-block .tri-info { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; }
        .wuxing-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }
        .wuxing-dot.metal { background: var(--wuxing-metal); box-shadow: 0 0 6px var(--wuxing-metal); }
        .wuxing-dot.wood  { background: var(--wuxing-wood);  box-shadow: 0 0 6px var(--wuxing-wood);  }
        .wuxing-dot.water { background: var(--wuxing-water); box-shadow: 0 0 6px var(--wuxing-water); }
        .wuxing-dot.fire  { background: var(--wuxing-fire);  box-shadow: 0 0 6px var(--wuxing-fire);  }
        .wuxing-dot.earth { background: var(--wuxing-earth); box-shadow: 0 0 6px var(--wuxing-earth); }
        .trigram-divider { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .trigram-divider .taiji-icon { width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(from 90deg, #1a1a2e 0% 50%, var(--gold) 50% 100%); position: relative; opacity: 0.65; }
        .trigram-divider .taiji-icon::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px rgba(255,215,0,0.5); }
        .wuxing-relation { font-size: 0.78rem; letter-spacing: 1px; padding: 3px 12px; border-radius: 12px; }
        .wuxing-relation.sheng { color: #66bb6a; background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.18); }
        .wuxing-relation.ke { color: #ef5350; background: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.18); }

        .hexagram-visual { padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .section-title { color: var(--gold); font-size: 0.9rem; letter-spacing: 4px; margin-bottom: 12px; text-align: center; }
        .yao-row { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 320px; }
        .yao-label { width: 48px; text-align: right; font-size: 0.82rem; color: var(--text-muted); letter-spacing: 1px; flex-shrink: 0; }
        .yao-line { flex: 1; height: 14px; border-radius: 7px; position: relative; overflow: hidden; }
        .yao-line.yang { background: linear-gradient(90deg, #b8860b, #ffd700, #ffec8b, #ffd700, #b8860b); box-shadow: 0 0 12px rgba(255,215,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2); animation: drawYang 0.8s ease-out forwards; transform-origin: left center; }
        .yao-line.yin { display: flex; gap: 16px; justify-content: center; background: transparent; }
        .yao-line.yin::before, .yao-line.yin::after { content: ''; flex: 1; max-width: calc(50% - 14px); height: 14px; border-radius: 7px; background: linear-gradient(90deg, #4a4a6a, #6a6a8a, #4a4a6a); box-shadow: 0 0 6px rgba(100,100,160,0.2); animation: drawYinHalf 0.6s ease-out forwards; transform-origin: left center; }
        .yao-line.yin::after { animation-delay: 0.1s; }
        @keyframes drawYang { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
        @keyframes drawYinHalf { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

        .guaci-card { border-left: 4px solid var(--gold); background: rgba(255,215,0,0.035); }
        .guaci-card .section-label { font-size: 0.76rem; color: var(--gold); letter-spacing: 3px; margin-bottom: 6px; }
        .guaci-card .plain-text { font-size: 0.92rem; color: var(--text-secondary); letter-spacing: 1px; line-height: 1.9; }

        /* 灵签诗句 */
        .verse-card { text-align: center; border: 1px solid rgba(255,215,0,0.18); background: rgba(255,215,0,0.04); }
        .verse-card .verse-text { font-size: 1.25rem; color: var(--gold); letter-spacing: 3px; line-height: 2.2; font-style: italic; text-shadow: 0 0 20px rgba(255,215,0,0.25); }

        /* 塔罗牌 */
        .tarot-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .tarot-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,215,0,0.15); border-radius: 12px; padding: 16px 10px; text-align: center; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .tarot-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(255,215,0,0.15); }
        .tarot-card.reversed { border-color: rgba(100,150,255,0.3); background: rgba(100,150,255,0.04); }
        .tarot-card .tarot-emoji { font-size: 2.4rem; line-height: 1; margin-bottom: 8px; }
        .tarot-card .tarot-pos { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 4px; }
        .tarot-card .tarot-name { font-size: 0.95rem; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
        .tarot-card .tarot-mean { font-size: 0.76rem; color: var(--text-secondary); line-height: 1.6; }

        /* 键值列表（姓名 / 运势） */
        .kv-card { border-left: 4px solid var(--gold); background: rgba(255,215,0,0.035); }
        .kv-card .section-label { font-size: 0.76rem; color: var(--gold); letter-spacing: 3px; margin-bottom: 10px; }
        .kv-row { display: flex; gap: 14px; padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: baseline; }
        .kv-row:last-child { border-bottom: none; }
        .kv-row .kv-k { flex-shrink: 0; width: 76px; color: var(--text-muted); font-size: 0.84rem; letter-spacing: 2px; }
        .kv-row .kv-v { color: var(--text-primary); font-size: 0.92rem; line-height: 1.7; }
        .kv-row .kv-v.sheng { color: #66bb6a; }
        .kv-row .kv-v.ke { color: #ef5350; }

        /* AI 解读 */
        .explanation-card { border-left: 4px solid var(--gold); background: rgba(255,215,0,0.045); position: relative; overflow: hidden; }
        .explanation-card::after { content: '\262F'; position: absolute; right: 14px; bottom: 14px; font-size: 3.5rem; color: rgba(255,215,0,0.035); pointer-events: none; line-height: 1; }
        .explanation-content { color: #d8d8d8; font-size: 0.94rem; line-height: 2.05; position: relative; z-index: 1; white-space: pre-wrap; }

        /* ============ FOOTER ============ */
        .site-footer { text-align: center; margin-top: 24px; color: #4a4a5a; font-size: 0.76rem; letter-spacing: 2px; line-height: 1.8; }
        .site-footer .footer-ornament { color: rgba(255,215,0,0.15); margin-bottom: 6px; letter-spacing: 4px; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            .container { padding: 14px 12px; }
            .site-header h1 { font-size: 1.8rem; letter-spacing: 6px; }
            .site-header .brand-icon { font-size: 2rem; }
            .type-chip { flex: 1 1 calc(50% - 8px); }
            .features-row { gap: 6px; }
            .feature-item { padding: 10px 6px; }
            .feature-item .feature-icon { font-size: 1.3rem; }
            .feature-item .feature-label { font-size: 0.7rem; letter-spacing: 1px; }
            .form-card { padding: 20px 16px; }
            .header-card { padding: 24px 16px; }
            .header-card .hex-name { font-size: 1.9rem; letter-spacing: 4px; }
            .trigram-detail { grid-template-columns: 1fr; gap: 10px; }
            .trigram-divider { flex-direction: row; }
            .trigram-divider .taiji-icon { width: 28px; height: 28px; }
            .trigram-block .tri-symbol { font-size: 2.2rem; }
            .trigram-block .tri-name { font-size: 1.2rem; }
            .yao-row { max-width: 100%; }
            .yao-label { width: 38px; font-size: 0.74rem; }
            .yao-line { height: 12px; }
            .yao-line.yin::before, .yao-line.yin::after { height: 12px; max-width: calc(50% - 10px); }
            .tarot-cards { gap: 8px; }
            .tarot-card .tarot-emoji { font-size: 2rem; }
            .verse-card .verse-text { font-size: 1.05rem; letter-spacing: 2px; }
            .explanation-card::after { font-size: 2.5rem; right: 8px; bottom: 8px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ========== HEADER ========== -->
    <div class="site-header">
        <div class="brand-icon">☰ ☷</div>
        <h1>易 经 算 命</h1>
        <div class="ornament">✦</div>
        <p class="subtitle">静心凝神 · 洞察天机</p>
    </div>

    <!-- ========== FEATURES ========== -->
    <div class="features-row">
        <div class="feature-item"><span class="feature-icon">🧧</span><span class="feature-label">五种占卜</span></div>
        <div class="feature-item"><span class="feature-icon">🤖</span><span class="feature-label">AI 先生解读</span></div>
        <div class="feature-item"><span class="feature-icon">💬</span><span class="feature-label">有人情味</span></div>
    </div>

    <!-- ========== TYPE SELECTOR ========== -->
    <div class="type-selector" id="typeSelector"></div>
    <div class="type-desc" id="typeDesc"></div>

    <!-- ========== FORM ========== -->
    <div class="form-card" id="formCard">
        <div class="form-header">
            <span class="step-badge">请 填 写 信 息</span>
            <h3 id="formTitle">诚心发问，卦象自明</h3>
        </div>
        <form id="fortuneForm">
            <div id="formFields"></div>
            <button type="submit" class="btn btn-primary" id="submitBtn">☯ 　开 始 占 卜　 ☯</button>
        </form>
    </div>

    <!-- ========== LOADING ========== -->
    <div class="loading" id="loading">
        <div class="loading-bagua"><div class="ring"></div><div class="ring"></div><div class="center-dot"></div></div>
        <p class="loading-text" id="loadingText">先生正在为您起卦</p>
        <p class="loading-sub">静候片刻，天机将现…</p>
    </div>

    <!-- ========== ERROR ========== -->
    <div class="error" id="error"></div>

    <!-- ========== RESULT ========== -->
    <div class="result" id="result">
        <div id="resultInner"></div>
        <button class="btn btn-secondary" onclick="resetForm()" style="margin-bottom:20px;">再 算 一 卦</button>
    </div>

    <!-- ========== FOOTER ========== -->
    <div class="site-footer">
        <div class="footer-ornament">── ✦ ──</div>
        <p>基于周易 · 灵签 · 塔罗 · DeepSeek AI</p>
        <p>本系统仅供娱乐参考</p>
    </div>

</div>

<script>
    const WUXING_COLOR_CLASS = { '金':'metal','木':'wood','水':'water','火':'fire','土':'earth' };
    const CN_NUM = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖','拾'];
    function dotCls(el){ return WUXING_COLOR_CLASS[el] || ''; }

    // 离线兜底配置（接口不可用时仍能使用）
    const FALLBACK_TYPES = [
        { id:'zhouyi', label:'易经起卦', icon:'☯', desc:'以姓名心愿起卦，观六十四卦玄机', fields:[
            {key:'name',label:'您的姓名',type:'text',required:true,hint:'卦象与您相应，以求天人感应',placeholder:'请输入您的姓名'},
            {key:'question',label:'您想问的事',type:'textarea',required:true,hint:'心诚则灵，越具体越准',placeholder:'事业前程、姻缘感情、财运走向……'},
            {key:'birthTime',label:'出生时辰',type:'text',required:false,hint:'生辰有助断卦，不知可留空',placeholder:'子时 / 卯时 / 午时 …'} ]},
        { id:'lingqian', label:'灵签问事', icon:'🏮', desc:'心有所疑，诚心求一签以决疑', fields:[
            {key:'name',label:'您的姓名',type:'text',required:false,hint:'留空亦可',placeholder:'可不填'},
            {key:'question',label:'心中所问',type:'textarea',required:true,hint:'默念所求，再诚心求签',placeholder:'姻缘可否成 / 此事吉凶如何 …'} ]},
        { id:'tarot', label:'塔罗占卜', icon:'🎴', desc:'抽三张塔罗，照见过去·现在·未来', fields:[
            {key:'name',label:'您的姓名',type:'text',required:false,hint:'留空亦可',placeholder:'可不填'},
            {key:'question',label:'占问之事',type:'textarea',required:true,hint:'专注一个问题，再抽牌',placeholder:'当下的困惑 / 面临的选择 …'} ]},
        { id:'xingming', label:'姓名测算', icon:'✒️', desc:'拆名解字，探姓名中藏的运势', fields:[
            {key:'name',label:'要测算的名字',type:'text',required:true,hint:'为您自己或他人起名参考',placeholder:'请输入姓名'},
            {key:'birthTime',label:'生肖 / 出生年',type:'text',required:false,hint:'如：龙 / 1990，用于补益参考',placeholder:'可选，如 马'} ]},
        { id:'yunshi', label:'每日运势', icon:'📅', desc:'看今日黄历，知宜忌与吉方', fields:[
            {key:'zodiac',label:'您的生肖',type:'text',required:true,hint:'鼠牛虎兔龙蛇马羊猴鸡狗猪',placeholder:'如：龙'},
            {key:'name',label:'您的姓名',type:'text',required:false,hint:'留空亦可',placeholder:'可不填'} ]},
    ];

    let TYPES = [];
    let currentType = 'zhouyi';
    const LOADING_TEXTS = {
        zhouyi: '先生正在为您起卦解卦',
        lingqian: '先生正在为您求签',
        tarot: '先生正在为您洗牌抽牌',
        xingming: '先生正在为您拆名解字',
        yunshi: '先生正在为您翻看黄历',
    };

    const form = document.getElementById('fortuneForm');
    const formCard = document.getElementById('formCard');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const result = document.getElementById('result');
    const resultInner = document.getElementById('resultInner');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    function escapeHtml(s){
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function loadTypes(){
        try {
            const r = await fetch('/api/types');
            if (!r.ok) throw new Error('bad');
            TYPES = await r.json();
        } catch(e){
            TYPES = FALLBACK_TYPES;
        }
        renderTypeSelector();
        selectType(TYPES[0].id);
    }

    function renderTypeSelector(){
        const box = document.getElementById('typeSelector');
        box.innerHTML = '';
        TYPES.forEach(function(t){
            const chip = document.createElement('div');
            chip.className = 'type-chip';
            chip.dataset.id = t.id;
            chip.innerHTML = '<span class="chip-icon">'+escapeHtml(t.icon)+'</span><span class="chip-label">'+escapeHtml(t.label)+'</span>';
            chip.addEventListener('click', function(){ selectType(t.id); });
            box.appendChild(chip);
        });
    }

    function selectType(id){
        currentType = id;
        const t = TYPES.find(function(x){ return x.id === id; });
        if (!t) return;
        document.querySelectorAll('.type-chip').forEach(function(c){
            c.classList.toggle('active', c.dataset.id === id);
        });
        document.getElementById('typeDesc').textContent = t.desc || '';
        document.getElementById('formTitle').textContent = t.label + ' · 诚心发问';
        loadingText.textContent = LOADING_TEXTS[id] || '先生正在为您占卜';
        submitBtn.textContent = '☯ 　' + t.label + '　 ☯';
        buildForm(t);
    }

    function buildForm(t){
        const box = document.getElementById('formFields');
        box.innerHTML = '';
        t.fields.forEach(function(f, i){
            const group = document.createElement('div');
            group.className = 'form-group';
            const num = CN_NUM[i+1] || (i+1);
            const reqMark = f.required ? '' : ' <span style="color:var(--text-muted);font-size:0.76rem;letter-spacing:1px;">（可选）</span>';
            const hint = f.hint ? '<div class="field-hint">'+escapeHtml(f.hint)+'</div>' : '';
            const input = f.type === 'textarea'
                ? '<textarea id="f_'+f.key+'" name="'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'"'+(f.required?' required':'')+'></textarea>'
                : '<input type="text" id="f_'+f.key+'" name="'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'"'+(f.required?' required':'')+'>';
            group.innerHTML =
                '<div class="field-header"><span class="field-num">'+num+'</span><label for="f_'+f.key+'">'+escapeHtml(f.label)+reqMark+'</label></div>' +
                input + hint;
            box.appendChild(group);
        });
    }

    // ---- 结果块渲染 ----
    function renderBlock(b){
        switch(b.kind){
            case 'header':
                return '<div class="result-card header-card">' +
                    (b.pinyin ? '<div class="pinyin">'+escapeHtml(b.pinyin)+'</div>' : '') +
                    '<div class="hex-name">'+escapeHtml(b.title)+'</div>' +
                    (b.num ? '<div class="hex-num">'+escapeHtml(b.num)+'</div>' : '') +
                    (b.badge ? '<span class="judgement-badge '+b.badge.cls+'">'+escapeHtml(b.badge.text)+'</span>' : '') +
                    '</div>';
            case 'pair':
                const L = b.left, R = b.right;
                const center = b.center
                    ? '<div class="trigram-divider"><div class="taiji-icon"></div><div class="wuxing-relation '+b.center.cls+'">'+escapeHtml(b.center.text)+'</div></div>'
                    : '<div class="trigram-divider"><div class="taiji-icon"></div></div>';
                return '<div class="result-card"><div class="trigram-detail">' +
                    '<div class="trigram-block"><div class="tri-symbol">'+escapeHtml(L.symbol)+'</div><div class="tri-name">'+escapeHtml(L.name)+'</div><div class="tri-info"><span class="wuxing-dot '+dotCls(L.element)+'"></span>'+escapeHtml(L.element)+' · '+escapeHtml(L.nature)+' · '+escapeHtml(L.direction)+'</div></div>' +
                    center +
                    '<div class="trigram-block"><div class="tri-symbol">'+escapeHtml(R.symbol)+'</div><div class="tri-name">'+escapeHtml(R.name)+'</div><div class="tri-info"><span class="wuxing-dot '+dotCls(R.element)+'"></span>'+escapeHtml(R.element)+' · '+escapeHtml(R.nature)+' · '+escapeHtml(R.direction)+'</div></div>' +
                    '</div></div>';
            case 'lines':
                let rows = '';
                for (let i = b.values.length-1; i >= 0; i--){
                    rows += '<div class="yao-row"><span class="yao-label">'+escapeHtml(b.labels[i])+'</span><div class="yao-line '+(b.values[i]===1?'yang':'yin')+'" style="animation-delay:'+((b.values.length-1-i)*0.12)+'s"></div></div>';
                }
                return '<div class="result-card hexagram-visual"><div class="section-title">◇ 六 爻 卦 象 ◇</div>'+rows+'</div>';
            case 'verse':
                return '<div class="result-card verse-card"><div class="section-title">◇ 签 诗 ◇</div><div class="verse-text">'+escapeHtml(b.text)+'</div></div>';
            case 'cards':
                const cards = b.items.map(function(it){
                    return '<div class="tarot-card'+(it.reversed?' reversed':'')+'">' +
                        '<div class="tarot-emoji">'+escapeHtml(it.emoji)+'</div>' +
                        '<div class="tarot-pos">'+escapeHtml(it.pos)+'</div>' +
                        '<div class="tarot-name">'+escapeHtml(it.name)+(it.reversed?' · 逆位':' · 正位')+'</div>' +
                        '<div class="tarot-mean">'+escapeHtml(it.meaning)+'</div>' +
                        '</div>';
                }).join('');
                return '<div class="result-card"><div class="section-title">◇ 牌 阵 ◇</div><div class="tarot-cards">'+cards+'</div></div>';
            case 'kv':
                const rows2 = b.items.map(function(it){
                    return '<div class="kv-row"><span class="kv-k">'+escapeHtml(it.k)+'</span><span class="kv-v '+(it.cls||'')+'">'+escapeHtml(it.v)+'</span></div>';
                }).join('');
                return '<div class="result-card kv-card"><div class="section-label">'+escapeHtml(b.title)+'</div>'+rows2+'</div>';
            case 'text':
                return '<div class="result-card guaci-card"><div class="section-label">'+escapeHtml(b.title)+'</div><div class="plain-text">'+escapeHtml(b.text)+'</div></div>';
            case 'ai':
                return '<div class="result-card explanation-card"><div class="section-title">'+escapeHtml(b.title)+'</div><div class="explanation-content">'+escapeHtml(b.text)+'</div></div>';
            default:
                return '';
        }
    }

    function showResult(data){
        loading.classList.remove('show');
        result.classList.add('show');
        resultInner.innerHTML = (data.blocks || []).map(renderBlock).join('');
        const cards = resultInner.querySelectorAll('.result-card');
        cards.forEach(function(card, index){
            card.classList.remove('visible');
            void card.offsetWidth;
            setTimeout(function(){
                card.style.transitionDelay = (index*0.08)+'s';
                card.classList.add('visible');
            }, 30);
        });
        result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showLoading(){
        formCard.style.display = 'none';
        result.classList.remove('show');
        errorEl.classList.remove('show');
        loading.classList.add('show');
    }
    function showError(message){
        loading.classList.remove('show');
        errorEl.textContent = message;
        errorEl.classList.add('show');
        formCard.style.display = '';
    }
    function resetForm(){
        result.classList.remove('show');
        formCard.style.display = '';
        form.reset();
        resultInner.innerHTML = '';
        document.querySelectorAll('.result-card').forEach(function(c){ c.classList.remove('visible'); });
    }

    form.addEventListener('submit', function(e){
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = '占卜中...';
        showLoading();

        const t = TYPES.find(function(x){ return x.id === currentType; });
        const payload = { type: currentType };
        (t ? t.fields : []).forEach(function(f){
            const el = document.getElementById('f_' + f.key);
            if (el) payload[f.key] = el.value.trim();
        });

        fetch('/api/fortune', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(response){
            return response.json().then(function(data){
                if (!response.ok) throw new Error(data.error || '占卜服务出错');
                return data;
            });
        })
        .then(function(data){ showResult(data); })
        .catch(function(err){ showError(err.message || '网络错误，请稍后重试'); })
        .finally(function(){
            submitBtn.disabled = false;
            const tt = TYPES.find(function(x){ return x.id === currentType; });
            submitBtn.textContent = '☯ 　' + (tt ? tt.label : '开始占卜') + '　 ☯';
        });
    });

    loadTypes();
</script>
</body>
</html>
