<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="易经算命系统 — 基于周易六十四卦、梅花易数与DeepSeek AI智能解读">
    <title>易经算命 | 卦象解读</title>
    <style>
        :root {
            --bg-deep: #1a1a2e;
            --bg-mid: #16213e;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.12);
            --gold-glow: rgba(255, 215, 0, 0.35);
            --text-primary: #e8e8e8;
            --text-secondary: #b0b0b0;
            --text-muted: #888;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --wuxing-metal: #ffd700;
            --wuxing-wood: #4caf50;
            --wuxing-water: #42a5f5;
            --wuxing-fire: #ef5350;
            --wuxing-earth: #ff9800;
            --judge-daji: #66bb6a;
            --judge-xiong: #ef5350;
            --judge-ping: #ffa726;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
            background: linear-gradient(170deg, #0d0d1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(255, 215, 0, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 50%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(100, 150, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* ================================================================
           HEADER
           ================================================================ */
        .site-header {
            text-align: center;
            margin-bottom: 10px;
            padding-top: 10px;
        }
        .site-header .brand-icon {
            font-size: 2.4rem;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            letter-spacing: 6px;
            margin-bottom: 6px;
        }
        .site-header h1 {
            font-size: 2.2rem;
            color: var(--gold);
            text-shadow: 0 0 35px rgba(255, 215, 0, 0.4), 0 0 70px rgba(255, 215, 0, 0.1);
            letter-spacing: 8px;
            margin-bottom: 0;
            font-weight: 700;
        }
        .site-header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 12px 0 6px;
            color: rgba(255, 215, 0, 0.3);
            font-size: 0.6rem;
            letter-spacing: 4px;
        }
        .site-header .ornament::before,
        .site-header .ornament::after {
            content: '';
            flex: 1;
            max-width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
        }
        .site-header .subtitle {
            color: var(--text-muted);
            font-size: 0.88rem;
            letter-spacing: 4px;
        }

        /* ================================================================
           TYPE SELECTOR
           ================================================================ */
        .type-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .type-btn {
            text-align: center;
            padding: 12px 6px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .type-btn:hover {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.06);
        }
        .type-btn.active {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.15);
        }
        .type-btn .type-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }
        .type-btn .type-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .type-btn.active .type-label {
            color: var(--gold);
        }

        /* ================================================================
           VIEWS — 五个独立页面，切换动画
           ================================================================ */
        .views-wrapper {
            position: relative;
            min-height: 400px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: viewEnter 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .view.exiting {
            animation: viewExit 0.25s ease-in forwards;
        }

        @keyframes viewEnter {
            from {
                opacity: 0;
                transform: translateX(50px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes viewExit {
            from {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(-30px) scale(0.98);
            }
        }

        /* ================================================================
           FORM CARD
           ================================================================ */
        .form-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px 24px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            margin-bottom: 16px;
        }
        .form-card .form-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .form-card .form-header .step-badge {
            display: inline-block;
            font-size: 0.72rem;
            color: var(--gold);
            letter-spacing: 3px;
            padding: 4px 14px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.06);
            margin-bottom: 10px;
        }
        .form-card .form-header h3 {
            font-size: 1.15rem;
            color: var(--text-primary);
            letter-spacing: 3px;
            font-weight: 600;
        }
        .form-card .form-header .type-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group .field-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-group .field-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.12);
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .form-group label {
            color: #c8c8c8;
            font-size: 0.92rem;
            letter-spacing: 2px;
        }
        .form-group .field-hint {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-top: 2px;
            margin-left: 36px;
            letter-spacing: 1px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.98rem;
            font-family: inherit;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15), inset 0 0 0 1px rgba(255, 215, 0, 0.1);
            background: rgba(255, 255, 255, 0.06);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555;
        }
        .form-group .required-star {
            color: #ef5350;
            margin-left: 4px;
        }
        .form-group .optional-tag {
            color: var(--text-muted);
            font-size: 0.76rem;
            letter-spacing: 1px;
            margin-left: 6px;
        }

        /* ================================================================
           BUTTONS
           ================================================================ */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s ease;
            letter-spacing: 4px;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e6c200 0%, #ffd700 30%, #ffaa00 100%);
            color: #1a1a2e;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }
        .btn-primary:hover::after {
            left: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.35);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            letter-spacing: 3px;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* ================================================================
           LOADING
           ================================================================ */
        .loading {
            display: none;
            text-align: center;
            padding: 60px 40px;
        }
        .loading.show { display: block; }
        .loading-bagua {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            position: relative;
        }
        .loading-bagua .ring {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: baguaSpin 3s linear infinite;
        }
        .loading-bagua .ring:nth-child(1) {
            border-top-color: var(--gold);
            border-right-color: var(--gold);
        }
        .loading-bagua .ring:nth-child(2) {
            inset: 10px;
            border-bottom-color: rgba(255, 215, 0, 0.5);
            border-left-color: rgba(255, 215, 0, 0.5);
            animation-direction: reverse;
            animation-duration: 2s;
        }
        .loading-bagua .center-dot {
            position: absolute;
            inset: 50%;
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 18px var(--gold-glow);
        }
        @keyframes baguaSpin { to { transform: rotate(360deg); } }
        .loading .loading-text {
            color: var(--text-secondary);
            letter-spacing: 3px;
            font-size: 0.95rem;
            animation: fadeText 2s ease-in-out infinite;
        }
        .loading .loading-sub {
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        @keyframes fadeText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ================================================================
           ERROR
           ================================================================ */
        .error {
            color: #ef5350;
            text-align: center;
            padding: 16px;
            background: rgba(244, 67, 54, 0.08);
            border: 1px solid rgba(244, 67, 54, 0.2);
            border-radius: 10px;
            display: none;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .error.show { display: block; }

        /* ================================================================
           RESULT AREA
           ================================================================ */
        .result { display: none; }
        .result.show { display: block; }

        .result-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 14px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- 1. 头部卡片 ---------- */
        .header-card {
            text-align: center;
            padding: 32px 24px;
            border: 1px solid rgba(255, 215, 0, 0.18);
            background: rgba(255, 215, 0, 0.04);
        }
        .header-card .pinyin {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 8px;
            font-style: italic;
        }
        .header-card .hex-name {
            font-size: 2.4rem;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.45);
            letter-spacing: 8px;
        }
        .header-card .hex-num {
            font-size: 0.88rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin: 6px 0 14px;
        }

        .judgement-badge {
            display: inline-block;
            padding: 6px 28px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            animation: glowPulse 2s ease-in-out infinite;
        }
        .judgement-badge.daji {
            background: rgba(76, 175, 80, 0.18);
            color: var(--judge-daji);
            border: 1px solid rgba(76, 175, 80, 0.4);
            box-shadow: 0 0 18px rgba(76, 175, 80, 0.2);
        }
        .judgement-badge.xiong {
            background: rgba(244, 67, 54, 0.18);
            color: var(--judge-xiong);
            border: 1px solid rgba(244, 67, 54, 0.4);
            box-shadow: 0 0 18px rgba(244, 67, 54, 0.2);
        }
        .judgement-badge.ping {
            background: rgba(255, 152, 0, 0.18);
            color: var(--judge-ping);
            border: 1px solid rgba(255, 152, 0, 0.4);
            box-shadow: 0 0 18px rgba(255, 152, 0, 0.2);
        }
        @keyframes glowPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.25); }
        }

        /* ---------- 2. 八卦详情 ---------- */
        .trigram-detail {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 14px;
            align-items: center;
            text-align: center;
        }
        .trigram-block {
            padding: 16px;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .trigram-block .tri-symbol {
            font-size: 2.8rem;
            color: var(--gold);
            text-shadow: 0 0 16px rgba(255, 215, 0, 0.3);
            line-height: 1.2;
        }
        .trigram-block .tri-name {
            font-size: 1.4rem;
            color: var(--text-primary);
            letter-spacing: 3px;
            margin: 4px 0;
        }
        .trigram-block .tri-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .wuxing-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 3px;
        }
        .wuxing-dot.metal { background: var(--wuxing-metal); box-shadow: 0 0 6px var(--wuxing-metal); }
        .wuxing-dot.wood  { background: var(--wuxing-wood);  box-shadow: 0 0 6px var(--wuxing-wood);  }
        .wuxing-dot.water { background: var(--wuxing-water); box-shadow: 0 0 6px var(--wuxing-water); }
        .wuxing-dot.fire  { background: var(--wuxing-fire);  box-shadow: 0 0 6px var(--wuxing-fire);  }
        .wuxing-dot.earth { background: var(--wuxing-earth); box-shadow: 0 0 6px var(--wuxing-earth); }

        .trigram-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .trigram-divider .taiji-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: conic-gradient(from 90deg, #1a1a2e 0% 50%, var(--gold) 50% 100%);
            position: relative;
            opacity: 0.65;
        }
        .trigram-divider .taiji-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
        }
        .wuxing-relation {
            font-size: 0.78rem;
            letter-spacing: 1px;
            padding: 3px 12px;
            border-radius: 12px;
        }
        .wuxing-relation.sheng {
            color: #66bb6a;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.18);
        }
        .wuxing-relation.ke {
            color: #ef5350;
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.18);
        }

        /* ---------- 3. 六爻卦象 ---------- */
        .hexagram-visual {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .section-title {
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-align: center;
        }
        .yao-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
        .yao-label {
            width: 48px;
            text-align: right;
            font-size: 0.82rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .yao-line {
            flex: 1;
            height: 14px;
            border-radius: 7px;
            position: relative;
            overflow: hidden;
        }
        .yao-line.yang {
            background: linear-gradient(90deg, #b8860b, #ffd700, #ffec8b, #ffd700, #b8860b);
            box-shadow: 0 0 12px rgba(255,215,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
            animation: drawYang 0.8s ease-out forwards;
            transform-origin: left center;
        }
        .yao-line.yin {
            display: flex;
            gap: 16px;
            justify-content: center;
            background: transparent;
        }
        .yao-line.yin::before,
        .yao-line.yin::after {
            content: '';
            flex: 1;
            max-width: calc(50% - 14px);
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(90deg, #4a4a6a, #6a6a8a, #4a4a6a);
            box-shadow: 0 0 6px rgba(100,100,160,0.2);
            animation: drawYinHalf 0.6s ease-out forwards;
            transform-origin: left center;
        }
        .yao-line.yin::after { animation-delay: 0.1s; }
        @keyframes drawYang   { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
        @keyframes drawYinHalf { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }

        /* ---------- 4. 文本卡片 ---------- */
        .text-card {
            border-left: 4px solid var(--gold);
            background: rgba(255, 215, 0, 0.035);
        }
        .text-card .section-label {
            font-size: 0.76rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .text-card .text-content {
            font-size: 0.95rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
            line-height: 1.8;
        }

        /* ---------- 5. 签诗卡片 ---------- */
        .verse-card {
            text-align: center;
            padding: 28px 24px;
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.12);
        }
        .verse-card .verse-text {
            font-size: 1.15rem;
            color: var(--gold);
            font-style: italic;
            letter-spacing: 3px;
            line-height: 2;
        }

        /* ---------- 6. 塔罗牌卡片 ---------- */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tarot-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.025);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .tarot-card .card-emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .tarot-card .card-info {
            flex: 1;
        }
        .tarot-card .card-pos {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .tarot-card .card-name {
            font-size: 1.05rem;
            color: var(--text-primary);
            letter-spacing: 2px;
        }
        .tarot-card .card-meaning {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.5;
        }
        .tarot-card .card-reversed {
            font-size: 0.7rem;
            color: #ef5350;
            margin-left: 6px;
            padding: 2px 8px;
            background: rgba(244, 67, 54, 0.12);
            border-radius: 8px;
        }

        /* ---------- 7. 键值对卡片 ---------- */
        .kv-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .kv-item {
            display: flex;
            padding: 10px 14px;
            background: rgba(255,255,255,0.015);
            border-radius: 8px;
            align-items: baseline;
        }
        .kv-item .kv-key {
            color: var(--gold);
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 2px;
            min-width: 70px;
        }
        .kv-item .kv-value {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .kv-item .kv-value.sheng { color: #66bb6a; }
        .kv-item .kv-value.ke { color: #ef5350; }

        /* ---------- 8. AI解读卡片 ---------- */
        .explanation-card {
            border-left: 4px solid var(--gold);
            background: rgba(255,215,0,0.045);
            position: relative;
            overflow: hidden;
        }
        .explanation-card::after {
            content: '\262F';
            position: absolute;
            right: 14px;
            bottom: 14px;
            font-size: 3.5rem;
            color: rgba(255,215,0,0.035);
            pointer-events: none;
            line-height: 1;
        }
        .explanation-content {
            color: #d8d8d8;
            font-size: 0.93rem;
            line-height: 2;
            position: relative;
            z-index: 1;
            white-space: pre-wrap;
        }

        /* ================================================================
           FOOTER
           ================================================================ */
        .site-footer {
            text-align: center;
            margin-top: 24px;
            color: #4a4a5a;
            font-size: 0.76rem;
            letter-spacing: 2px;
            line-height: 1.8;
        }
        .site-footer .footer-ornament {
            color: rgba(255,215,0,0.15);
            margin-bottom: 6px;
            letter-spacing: 4px;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 480px) {
            .container { padding: 14px 12px; }
            .site-header h1 { font-size: 1.8rem; letter-spacing: 6px; }
            .site-header .brand-icon { font-size: 2rem; }
            .type-selector { gap: 6px; }
            .type-btn { padding: 10px 4px; }
            .type-btn .type-icon { font-size: 1.3rem; }
            .type-btn .type-label { font-size: 0.65rem; }
            .form-card { padding: 20px 16px; }
            .header-card { padding: 24px 16px; }
            .header-card .hex-name { font-size: 2rem; letter-spacing: 6px; }
            .trigram-detail { grid-template-columns: 1fr; gap: 10px; }
            .trigram-divider { flex-direction: row; }
            .trigram-divider .taiji-icon { width: 28px; height: 28px; }
            .trigram-block .tri-symbol { font-size: 2.2rem; }
            .trigram-block .tri-name { font-size: 1.2rem; }
            .yao-row { max-width: 100%; }
            .yao-label { width: 38px; font-size: 0.74rem; }
            .yao-line { height: 12px; }
            .yao-line.yin::before,
            .yao-line.yin::after { height: 12px; max-width: calc(50% - 10px); }
            .explanation-card::after { font-size: 2.5rem; right: 8px; bottom: 8px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ========== HEADER ========== -->
    <div class="site-header">
        <div class="brand-icon">☰ ☷</div>
        <h1>易 经 算 命</h1>
        <div class="ornament">✦</div>
        <p class="subtitle">静心凝神 · 洞察天机</p>
    </div>

    <!-- ========== TYPE SELECTOR ========== -->
    <div class="type-selector" id="typeSelector"></div>

    <!-- ========== VIEWS ========== -->
    <div class="views-wrapper" id="viewsWrapper"></div>

    <!-- ========== LOADING ========== -->
    <div class="loading" id="loading">
        <div class="loading-bagua">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="center-dot"></div>
        </div>
        <p class="loading-text">大师正在为您推演</p>
        <p class="loading-sub">静候片刻，天机将现…</p>
    </div>

    <!-- ========== ERROR ========== -->
    <div class="error" id="error"></div>

    <!-- ========== FOOTER ========== -->
    <div class="site-footer">
        <div class="footer-ornament">── ✦ ──</div>
        <p>基于周易六十四卦 · 梅花易数 · DeepSeek AI</p>
        <p>本系统仅供娱乐参考</p>
    </div>

</div>

<script>
    const API_BASE = '';
    const WUXING_COLOR_CLASS = { '金':'metal','木':'wood','水':'water','火':'fire','土':'earth' };
    const CN_NUMS = ['壹','贰','叁','肆','伍'];

    let types = [];
    let currentViewId = null;
    let isAnimating = false;

    var loading    = document.getElementById('loading');
    var errorEl    = document.getElementById('error');

    // ==================== 初始化 ====================
    async function init() {
        try {
            const resp = await fetch(API_BASE + '/api/types');
            types = await resp.json();
            renderTypeSelector();
            renderViews();
            switchView(types[0].id);
        } catch (e) {
            showError('无法连接本地服务，请先运行 python app.py');
        }
    }

    function renderTypeSelector() {
        const el = document.getElementById('typeSelector');
        el.innerHTML = types.map(t =>
            '<div class="type-btn" data-id="' + t.id + '" onclick="switchView(\'' + t.id + '\')">' +
                '<span class="type-icon">' + t.icon + '</span>' +
                '<span class="type-label">' + t.label + '</span>' +
            '</div>'
        ).join('');
    }

    function renderViews() {
        const wrapper = document.getElementById('viewsWrapper');
        wrapper.innerHTML = types.map(t => {
            const fieldsHtml = t.fields.map((f, i) => {
                const star = f.required ? '<span class="required-star">*</span>' : '<span class="optional-tag">（可选）</span>';
                const tag = f.type === 'textarea'
                    ? '<textarea id="' + t.id + '_' + f.key + '" name="' + f.key + '" placeholder="' + (f.placeholder||'') + '"' + (f.required?' required':'') + '></textarea>'
                    : '<input type="text" id="' + t.id + '_' + f.key + '" name="' + f.key + '" placeholder="' + (f.placeholder||'') + '"' + (f.required?' required':'') + '>';
                return '<div class="form-group">' +
                    '<div class="field-header"><span class="field-num">' + CN_NUMS[i] + '</span><label>' + f.label + star + '</label></div>' +
                    tag +
                    (f.hint ? '<div class="field-hint">' + f.hint + '</div>' : '') +
                '</div>';
            }).join('');

            return '<div class="view" id="view-' + t.id + '" data-type="' + t.id + '">' +
                '<div class="form-card">' +
                    '<div class="form-header">' +
                        '<span class="step-badge">请 填 写 信 息</span>' +
                        '<h3>诚心发问，卦象自明</h3>' +
                        '<p class="type-desc">' + t.desc + '</p>' +
                    '</div>' +
                    '<form class="fortune-form" data-type="' + t.id + '">' +
                        fieldsHtml +
                        '<button type="submit" class="btn btn-primary">☯ 　开 始 占 卜　 ☯</button>' +
                    '</form>' +
                '</div>' +
                '<div class="result" id="result-' + t.id + '"></div>' +
            '</div>';
        }).join('');

        // 绑定表单提交
        document.querySelectorAll('.fortune-form').forEach(form => {
            form.addEventListener('submit', handleSubmit);
        });
    }

    // ==================== 视图切换 ====================
    function switchView(typeId) {
        if (isAnimating || currentViewId === typeId) return;

        const oldView = currentViewId ? document.getElementById('view-' + currentViewId) : null;
        const newView = document.getElementById('view-' + typeId);

        // 更新按钮状态
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.id === typeId);
        });

        if (!oldView) {
            // 首次加载，直接显示
            newView.classList.add('active');
            currentViewId = typeId;
            return;
        }

        isAnimating = true;

        // 旧视图退出动画
        oldView.classList.remove('active');
        oldView.classList.add('exiting');

        setTimeout(() => {
            oldView.classList.remove('exiting');
            oldView.style.display = 'none';

            // 新视图进入动画
            newView.style.display = '';
            newView.classList.add('active');

            currentViewId = typeId;
            isAnimating = false;
        }, 220);
    }

    // ==================== 提交 ====================
    async function handleSubmit(e) {
        e.preventDefault();
        const form = e.target;
        const typeId = form.dataset.type;
        const typeConfig = types.find(t => t.id === typeId);
        if (!typeConfig) return;

        const payload = { type: typeId };
        typeConfig.fields.forEach(f => {
            payload[f.key] = document.getElementById(typeId + '_' + f.key).value.trim();
        });

        showLoading();
        try {
            const resp = await fetch(API_BASE + '/api/fortune', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || '占卜失败');
            showResult(typeId, data);
        } catch (err) {
            showError(err.message || '网络错误，请检查本地服务是否运行');
        }
    }

    // ==================== 渲染结果 ====================
    function showResult(typeId, data) {
        loading.classList.remove('show');
        const view = document.getElementById('view-' + typeId);
        const resultEl = document.getElementById('result-' + typeId);
        const formCard = view.querySelector('.form-card');

        formCard.style.display = 'none';
        resultEl.classList.add('show');
        resultEl.innerHTML = '';

        data.blocks.forEach(block => {
            const card = createBlockCard(block);
            if (card) resultEl.appendChild(card);
        });

        const resetBtn = document.createElement('button');
        resetBtn.className = 'btn btn-secondary';
        resetBtn.style.marginBottom = '20px';
        resetBtn.textContent = '再 占 一 次';
        resetBtn.onclick = () => resetForm(typeId);
        resultEl.appendChild(resetBtn);

        animateCards(resultEl);
    }

    function createBlockCard(block) {
        switch(block.kind) {
            case 'header':    return createHeaderCard(block);
            case 'pair':      return createPairCard(block);
            case 'lines':     return createLinesCard(block);
            case 'text':      return createTextCard(block);
            case 'verse':     return createVerseCard(block);
            case 'cards':     return createCardsCard(block);
            case 'kv':        return createKvCard(block);
            case 'ai':        return createAiCard(block);
            default:          return null;
        }
    }

    function createHeaderCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card header-card';
        div.innerHTML =
            (b.pinyin ? '<div class="pinyin">' + b.pinyin + '</div>' : '') +
            '<div class="hex-name">' + b.title + '</div>' +
            '<div class="hex-num">' + b.num + '</div>' +
            '<span class="judgement-badge ' + (b.badge ? b.badge.cls : 'ping') + '">' + (b.badge ? b.badge.text : '') + '</span>';
        return div;
    }

    function createPairCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card';
        const rel = b.center ? '<div class="wuxing-relation ' + b.center.cls + '">' + b.center.text + '</div>' : '';
        div.innerHTML =
            '<div class="trigram-detail">' +
                '<div class="trigram-block">' +
                    '<div class="tri-symbol">' + b.left.symbol + '</div>' +
                    '<div class="tri-name">' + b.left.name + '</div>' +
                    '<div class="tri-info"><span class="wuxing-dot ' + (WUXING_COLOR_CLASS[b.left.element]||'') + '"></span>' + b.left.element + ' · ' + b.left.nature + ' · ' + b.left.direction + '</div>' +
                '</div>' +
                '<div class="trigram-divider"><div class="taiji-icon"></div>' + rel + '</div>' +
                '<div class="trigram-block">' +
                    '<div class="tri-symbol">' + b.right.symbol + '</div>' +
                    '<div class="tri-name">' + b.right.name + '</div>' +
                    '<div class="tri-info"><span class="wuxing-dot ' + (WUXING_COLOR_CLASS[b.right.element]||'') + '"></span>' + b.right.element + ' · ' + b.right.nature + ' · ' + b.right.direction + '</div>' +
                '</div>' +
            '</div>';
        return div;
    }

    function createLinesCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card hexagram-visual';
        let html = '<div class="section-title">◇ 六 爻 卦 象 ◇</div>';
        for (let i = b.values.length - 1; i >= 0; i--) {
            const cls = b.values[i] === 1 ? 'yang' : 'yin';
            html += '<div class="yao-row"><span class="yao-label">' + b.labels[i] + '</span><div class="yao-line ' + cls + '" style="animation-delay:' + ((b.values.length-1-i)*0.12) + 's"></div></div>';
        }
        div.innerHTML = html;
        return div;
    }

    function createTextCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card text-card';
        div.innerHTML =
            '<div class="section-label">' + b.title + '</div>' +
            '<div class="text-content">' + b.text + '</div>';
        return div;
    }

    function createVerseCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card verse-card';
        div.innerHTML = '<div class="verse-text">「' + b.text + '」</div>';
        return div;
    }

    function createCardsCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card';
        let html = '<div class="section-title">◇ 塔 罗 牌 阵 ◇</div><div class="cards-container">';
        b.items.forEach(item => {
            html += '<div class="tarot-card">' +
                '<div class="card-emoji">' + item.emoji + '</div>' +
                '<div class="card-info">' +
                    '<div class="card-pos">' + item.pos + (item.reversed ? '<span class="card-reversed">逆位</span>' : '') + '</div>' +
                    '<div class="card-name">' + item.name + '</div>' +
                    '<div class="card-meaning">' + item.meaning + '</div>' +
                '</div>' +
            '</div>';
        });
        html += '</div>';
        div.innerHTML = html;
        return div;
    }

    function createKvCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card';
        let html = '<div class="section-title">' + b.title + '</div><div class="kv-list">';
        b.items.forEach(item => {
            const cls = item.cls ? ' ' + item.cls : '';
            html += '<div class="kv-item"><span class="kv-key">' + item.k + '</span><span class="kv-value' + cls + '">' + item.v + '</span></div>';
        });
        html += '</div>';
        div.innerHTML = html;
        return div;
    }

    function createAiCard(b) {
        const div = document.createElement('div');
        div.className = 'result-card explanation-card';
        div.innerHTML =
            '<div class="section-title">' + b.title + '</div>' +
            '<div class="explanation-content">' + b.text + '</div>';
        return div;
    }

    // ==================== 辅助 ====================
    function showLoading() {
        errorEl.classList.remove('show');
        loading.classList.add('show');
    }

    function showError(message) {
        loading.classList.remove('show');
        errorEl.textContent = message;
        errorEl.classList.add('show');
    }

    function resetForm(typeId) {
        const view = document.getElementById('view-' + typeId);
        const resultEl = document.getElementById('result-' + typeId);
        const formCard = view.querySelector('.form-card');
        const form = view.querySelector('.fortune-form');

        resultEl.classList.remove('show');
        formCard.style.display = '';
        form.reset();
    }

    function animateCards(container) {
        const cards = container.querySelectorAll('.result-card');
        cards.forEach(function(card, index) {
            card.classList.remove('visible');
            void card.offsetWidth;
            setTimeout(function() {
                card.style.transitionDelay = (index * 0.08) + 's';
                card.classList.add('visible');
            }, 30);
        });
    }

    init();
</script>
</body>
</html>
